<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-bleed background rectangle for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Mountain Silhouette Backdrop in safe area -->
  <path d="M60 380 L180 270 L270 340 L370 250 L452 380 Z" fill="#047857" opacity="0.4" />
  <path d="M120 380 L230 300 L310 360 L400 290 L452 380 Z" fill="#065f46" opacity="0.3" />

  <!-- Inner safe-zone scaled graphic (center 256, 256, scaled to 0.85) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Main Inn Structure Group -->
    <g filter="url(#shadow)">
      <rect x="156" y="210" width="200" height="175" rx="16" fill="url(#roofGrad)" />
      <path d="M128 226 L256 108 L384 226 C388 230 380 238 372 234 L256 128 L140 234 C132 238 124 230 128 226 Z" fill="#ffffff" />
      <polygon points="256,128 368,230 144,230" fill="#f1f5f9" />

      <rect x="184" y="240" width="40" height="40" rx="8" fill="url(#goldGrad)" opacity="0.95" />
      <rect x="288" y="240" width="40" height="40" rx="8" fill="url(#goldGrad)" opacity="0.95" />
      <line x1="204" y1="240" x2="204" y2="280" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
      <line x1="184" y1="260" x2="224" y2="260" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
      <line x1="308" y1="240" x2="308" y2="280" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
      <line x1="288" y1="260" x2="328" y2="260" stroke="#b45309" stroke-width="2.5" opacity="0.6" />

      <path d="M232 385 L232 316 C232 308 240 302 248 302 L264 302 C272 302 280 308 280 316 L280 385 Z" fill="#0f172a" />
      <circle cx="272" cy="348" r="3" fill="#fbbf24" />
    </g>

    <!-- Prominent "Check" Emblem Badge -->
    <g filter="url(#shadow)">
      <circle cx="340" cy="350" r="64" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
      <circle cx="340" cy="350" r="54" fill="url(#checkGrad)" />
      <path d="M316 350 L332 366 L368 330" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(256, 178) scale(0.9)">
      <path d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z" fill="#fbbf24" />
    </g>
  </g>
</svg>
