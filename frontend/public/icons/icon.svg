<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Mountain Silhouette Backdrop (Malaybalay Pines / Mt. Kitanglad) -->
  <path d="M60 380 L180 260 L270 340 L370 240 L452 380 Z" fill="#047857" opacity="0.35" />
  <path d="M120 380 L230 290 L310 360 L400 280 L452 380 Z" fill="#065f46" opacity="0.3" />

  <!-- Main Inn Structure Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Hotel / Inn Building Base -->
    <rect x="156" y="210" width="200" height="175" rx="16" fill="url(#roofGrad)" />

    <!-- Inn Roof / Mountain Cottage Peak -->
    <path d="M128 226 L256 108 L384 226 C388 230 380 238 372 234 L256 128 L140 234 C132 238 124 230 128 226 Z" fill="#ffffff" />
    <polygon points="256,128 368,230 144,230" fill="#f1f5f9" />

    <!-- Hotel Windows (Illuminated Warm Lights) -->
    <rect x="184" y="240" width="40" height="40" rx="8" fill="url(#goldGrad)" opacity="0.9" />
    <rect x="288" y="240" width="40" height="40" rx="8" fill="url(#goldGrad)" opacity="0.9" />
    <line x1="204" y1="240" x2="204" y2="280" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
    <line x1="184" y1="260" x2="224" y2="260" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
    <line x1="308" y1="240" x2="308" y2="280" stroke="#b45309" stroke-width="2.5" opacity="0.6" />
    <line x1="288" y1="260" x2="328" y2="260" stroke="#b45309" stroke-width="2.5" opacity="0.6" />

    <!-- Inn Doorway -->
    <path d="M232 385 L232 316 C232 308 240 302 248 302 L264 302 C272 302 280 308 280 316 L280 385 Z" fill="#0f172a" />
    <circle cx="272" cy="348" r="3" fill="#fbbf24" />
  </g>

  <!-- Prominent "Check" Emblem Circle (LocalStay Signature Badge) -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="350" r="64" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
    <circle cx="340" cy="350" r="54" fill="url(#checkGrad)" />
    <!-- Dynamic Checkmark -->
    <path d="M316 350 L332 366 L368 330" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Small star accent representing 5-star quality service -->
  <g transform="translate(256, 178) scale(0.9)" filter="url(#glow)">
    <path d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z" fill="#fbbf24" />
  </g>
</svg>
