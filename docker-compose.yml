services:
  db:
    image: postgres:16-alpine
    container_name: localstay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localstay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localstaypassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: localstay_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localstay_backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "localstay-prod-secret-key-malaybalay-bukidnon"
      DB_NAME: localstay_db
      DB_USER: postgres
      DB_PASSWORD: localstaypassword
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localstay_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_DEBUG: "True"
      DB_NAME: localstay_db
      DB_USER: postgres
      DB_PASSWORD: localstaypassword
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localstay_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
