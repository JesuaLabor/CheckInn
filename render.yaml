services:
  - type: web
    name: localstay-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: localstay-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: "localstay_db"

databases:
  - name: localstay-postgres
    plan: free

